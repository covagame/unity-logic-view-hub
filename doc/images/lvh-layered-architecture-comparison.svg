<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Layered Architecture と Logic View Hub の比較</title>
  <desc id="desc">Layered Architecture の Application 層と Domain 層に相当する責務を、Logic View Hub では一つの大きな Logic として扱うことを示す比較図。</desc>
  <rect width="1200" height="700" fill="#ffffff"/>

  <g font-family="Arial, 'Noto Sans JP', sans-serif" fill="#182230">
    <rect x="40" y="30" width="1120" height="620" rx="12" fill="#ffffff" stroke="#344054" stroke-width="2"/>
    <rect x="40" y="30" width="1120" height="82" rx="12" fill="#eef4ff"/>
    <path d="M40 100H1160" stroke="#344054" stroke-width="2"/>
    <path d="M600 30V535" stroke="#344054" stroke-width="2"/>

    <text x="320" y="80" text-anchor="middle" font-size="25" font-weight="700">Layered Architecture</text>
    <text x="880" y="80" text-anchor="middle" font-size="25" font-weight="700">Logic-View-Hub</text>

    <path d="M40 235H600M40 385H600M40 535H1160" stroke="#98a2b3" stroke-width="2"/>

    <text x="320" y="178" text-anchor="middle" font-size="25" font-weight="700">UI</text>
    <text x="320" y="328" text-anchor="middle" font-size="25" font-weight="700">Application</text>
    <text x="320" y="478" text-anchor="middle" font-size="25" font-weight="700">Domain</text>
    <text x="600" y="602" text-anchor="middle" font-size="23" font-weight="700">Infrastructure / Repository</text>

    <rect x="690" y="132" width="380" height="54" rx="8" fill="#e9f7ef" stroke="#28865b" stroke-width="2"/>
    <text x="880" y="166" text-anchor="middle" font-size="21" font-weight="700">View / Device Input</text>

    <rect x="690" y="195" width="380" height="54" rx="8" fill="#fff5df" stroke="#b7791f" stroke-width="2"/>
    <text x="880" y="229" text-anchor="middle" font-size="21" font-weight="700">HubProperty</text>

    <rect x="690" y="278" width="380" height="230" rx="10" fill="#eef4ff" stroke="#3563b8" stroke-width="3"/>
    <text x="880" y="376" text-anchor="middle" font-size="34" font-weight="700">Logic</text>
    <text x="880" y="416" text-anchor="middle" font-size="20" fill="#475467">Application + Domain に近い責務</text>
  </g>
</svg>
